<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多模态工具 · 管理后台</title>
<style>
:root{
  --blue:#1D4ED8; --blue2:#1E40AF; --blue-bg:#EFF4FF; --line:#E7EAF0; --sub:#6B7280; --text:#1F2430;
  --bg:#F5F6FA; --card:#fff; --green:#16A34A; --red:#DC2626; --orange:#D97706;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:13px;}
input,select{font-family:inherit;font-size:13px;}

/* ===== 登录页 ===== */
#view-login{position:fixed;inset:0;background:linear-gradient(135deg,#EEF3FF 0%,#F5F6FA 55%,#EAF2FF 100%);display:flex;align-items:center;justify-content:center;}
.login-card{width:400px;background:#fff;border-radius:14px;padding:38px 40px 32px;box-shadow:0 18px 50px rgba(29,78,216,.10);}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.login-logo .lic{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;}
.login-title{font-size:19px;font-weight:700;}
.login-sub{font-size:12px;color:var(--sub);margin-bottom:24px;}
.login-card label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px;}
.login-card input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;}
.login-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.10);}
.login-go{width:100%;height:42px;background:var(--blue);color:#fff;border-radius:8px;font-size:14px;font-weight:600;margin-top:24px;}
.login-go:hover{background:var(--blue2);}
.login-tip{font-size:11px;color:#9CA3AF;text-align:center;margin-top:14px;}

/* ===== 后台框架 ===== */
.admin{display:flex;min-height:100vh;}
.sidebar{width:212px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20;}
.side-logo{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line);}
.side-logo .lic{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.side-logo b{font-size:15px;}
.side-logo span{display:block;font-size:10px;color:var(--sub);font-weight:400;}
.side-nav{flex:1;padding:10px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;color:#3B4252;cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:#F4F6FB;}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600;border-left-color:var(--blue);}
.nav-item .nicon{width:18px;height:18px;flex-shrink:0;}
.side-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:#9CA3AF;}

.main{margin-left:212px;flex:1;min-width:0;}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;}
.crumb{font-size:14px;font-weight:600;}
.crumb .c2{color:var(--sub);font-weight:400;margin-left:6px;font-size:13px;}
.tb-user{display:flex;align-items:center;gap:9px;}
.ava{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.tb-user .un{font-size:13px;font-weight:600;}
.tb-user .urole{font-size:11px;color:var(--sub);}
.content{padding:14px 24px 24px;width:100%;}

/* ===== 通用组件 ===== */
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);}
.panel-hd b{font-size:14px;}
.panel-bd{padding:16px 18px;}
.btn{border:1px solid var(--line);border-radius:7px;padding:6px 14px;font-size:13px;color:#374151;background:#fff;}
.btn:hover{border-color:#C3CBD9;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
.btn.primary:hover{background:var(--blue2);}
.btn.link{color:var(--blue);border:none;padding:3px 6px;font-size:13px;}
.btn.link.danger{color:var(--red);}
.btn.sm{padding:4px 10px;font-size:12px;}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font-size:13px;background:#fff;min-width:150px;}
.input:focus,.sel:focus{outline:none;border-color:var(--blue);}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search{display:flex;align-items:center;gap:8px;}
.search .input{min-width:200px;}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:#F0F2F7;color:#4B5563;}
.tag.blue{background:var(--blue-bg);color:var(--blue);}
.tag.green{background:#E7F6EC;color:var(--green);}
.tag.red{background:#FDECEC;color:var(--red);}
.tag.orange{background:#FEF3E2;color:var(--orange);}
.tag.gray{background:#F0F2F7;color:#6B7280;}
.tag.purple{background:#F1EBFE;color:#7C3AED;}

/* 统计卡 */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:10px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 16px;}
.stat .k{font-size:11.5px;color:var(--sub);}
.stat .v{font-size:20px;font-weight:700;margin-top:5px;}
.stat .d{font-size:11px;color:#9CA3AF;margin-top:4px;}
.stat.blue{border-top:3px solid var(--blue);}
.stat.green{border-top:3px solid var(--green);}
.stat.orange{border-top:3px solid var(--orange);}
.stat.purple{border-top:3px solid #7C3AED;}

/* 表格 */
.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:#F8F9FC;color:#5B6472;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;}
.tbl td{padding:11px 12px;border-bottom:1px solid #F0F2F7;vertical-align:middle;}
.tbl tr:hover td{background:#FAFBFF;}
.tbl .thumb{width:54px;height:40px;border-radius:6px;object-fit:cover;}
.tbl .ph{width:54px;height:40px;border-radius:6px;display:inline-block;}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:12px 16px;font-size:12px;color:var(--sub);}
.pager button{min-width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;}
.pager button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.pager button:disabled{opacity:.4;cursor:not-allowed;}
.page-info{color:#6B7280;margin-right:8px;}

/* 官方资源管理 · 一级/二级子tab */
.rtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;}
.rtabs button{font-size:13px;padding:8px 18px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px;background:none;}
.rtabs button:hover{color:var(--blue);}
.rtabs button.active{color:var(--blue);border-color:var(--blue);font-weight:700;}
.rtabs2{display:flex;gap:6px;margin-bottom:12px;}
.rtabs2 button{font-size:12px;padding:5px 16px;color:var(--sub);border:1px solid var(--line);border-radius:7px;background:#fff;}
.rtabs2 button:hover{border-color:var(--blue);color:var(--blue);}
.rtabs2 button.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}

/* 状态开关按钮 */
.switch{position:relative;width:36px;height:20px;border-radius:999px;background:#D3DAE4;display:inline-block;cursor:pointer;transition:background .2s;border:none;padding:0;vertical-align:middle;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.15);}
.switch.on{background:#2F6BFF;}
.switch.on::after{left:18px;}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:100;}
.modal.open{display:flex;}
.dialog{background:#fff;border-radius:12px;width:460px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.dialog-hd{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.dialog-hd .x{cursor:pointer;color:#9CA3AF;font-size:18px;padding:2px 6px;}
.dialog-bd{padding:20px;}
.dialog-ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);}
.dform label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;}
.dform .input,.dform .sel{width:100%;min-width:0;height:36px;}
.dform textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;}
.dform .lic{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
.dform .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text);cursor:pointer;}
.dform .chk input{accent-color:var(--blue);}
.frow{display:flex;gap:10px;}
.frow>div{flex:1;}

/* 首页图表 */
.chart-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.hourbars{display:flex;align-items:flex-end;gap:4px;height:112px;padding-top:8px;}
.hourbars .hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.hourbars .bar{width:100%;max-width:22px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#5B8DEF,#1D4ED8);min-height:2px;}
.hourbars .lbl{font-size:9px;color:#9CA3AF;}
.trend2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.gstat{background:#F8F9FC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.gstat .k{font-size:11px;color:var(--sub);}
.gstat .v{font-size:18px;font-weight:700;margin-top:4px;}

/* 生图/训练记录列表 */
.rlist{}
.ritem{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid #F0F2F7;}
.ritem:hover{background:#FAFBFF;}
.ritem .rid{font-family:Consolas,monospace;font-size:12px;color:#5B6472;background:#F0F2F7;border-radius:5px;padding:2px 8px;}
.ritem .rtime{font-size:12px;color:var(--sub);}
.ritem .rwho{min-width:110px;}
.ritem .rwhy{font-size:11px;color:var(--red);background:#FDECEC;border-radius:5px;padding:4px 8px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.radd{margin-left:auto;display:flex;align-items:center;gap:12px;}

/* ===== 账号下拉 ===== */
.user-box{position:relative;cursor:pointer;}
.user-main{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:9px;}
.user-main:hover{background:#F5F7FB;}
.user-main .carat{width:10px;height:10px;color:#9CA3AF;transition:transform .15s;}
.user-box.open .carat{transform:rotate(180deg);}
.user-menu{position:absolute;top:48px;right:0;width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 38px rgba(15,20,30,.13);z-index:60;display:none;padding:6px;}
.user-menu.open{display:block;}
.um-item{padding:9px 12px;font-size:13px;border-radius:7px;color:#374151;cursor:pointer;}
.um-item:hover{background:var(--blue-bg);color:var(--blue);}

/* 性能统计 */
.perf2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;}
.perf{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px 13px;height:174px;display:flex;flex-direction:column;box-sizing:border-box;}
.perf .pt{font-size:13px;font-weight:600;margin-bottom:9px;flex-shrink:0;}
.pcols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;align-content:center;}
.pcol{background:#F8F9FC;border:1px solid var(--line);border-radius:8px;padding:9px 11px;}
.pcol .k{font-size:10.5px;color:var(--sub);}
.pcol .v{font-size:16px;font-weight:700;margin-top:3px;}
.pcol .v.red{color:var(--red);} .pcol .v.green{color:var(--green);} .pcol .v.orange{color:var(--orange);}
.prates{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:10px;font-size:11px;color:#4B5563;flex-shrink:0;}
.prates span b{font-weight:600;}
.prates .ok{color:var(--green);} .prates .no{color:var(--red);} .prates .cc{color:var(--orange);}
.prates .avg{margin-left:auto;color:var(--sub);}
.pstat{display:flex;align-items:flex-start;gap:18px;}
.plegend{display:flex;flex-direction:column;gap:8px;min-width:128px;padding-top:6px;}
.plegend .li{display:flex;align-items:center;gap:7px;font-size:12px;color:#374151;}
.plegend .li i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0;}
.plegend .li b{margin-left:auto;font-size:12px;}

/* 热门模型柱状图 */
.hotchart{display:flex;flex-direction:column;flex:1;min-width:0;height:230px;}
.hot-row{display:flex;height:230px;min-height:0;align-items:stretch;}
.hot-y{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:#9CA3AF;padding:0 8px 0 0;text-align:right;flex-shrink:0;}
.hot-bars{flex:1;display:flex;align-items:flex-end;gap:26px;padding:0 24px;border-bottom:1px solid var(--line);position:relative;min-width:0;}
.hot-bar{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.hot-bar .bv{font-size:12px;font-weight:700;color:#1F2430;}
.hot-bar .bnm{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;}
</style>
</head>

var CUR={view:'home'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:13px;padding:9px 18px;border-radius:8px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2200);
}
function stTag(st){
  if(st==='成功'||st==='已发布')return '<span class="tag green">'+st+'</span>';
  if(st==='失败')return '<span class="tag red">'+st+'</span>';
  if(st==='执行中')return '<span class="tag blue">'+st+'</span>';
  if(st==='待审核')return '<span class="tag orange">'+st+'</span>';
  if(st==='已取消')return '<span class="tag gray">'+st+'</span>';
  if(st==='已下架')return '<span class="tag gray">'+st+'</span>';
  if(st===true||st==='启用')return '<span class="tag green">启用</span>';
  if(st===false||st==='停用')return '<span class="tag gray">停用</span>';
  return '<span class="tag">'+esc(st)+'</span>';
}
function wayTag(w){
  var m={对话生图:'blue',在线工作流:'purple'};
  return '<span class="tag '+(m[w]||'gray')+'">'+w+'</span>';
}
function yny(v){return v?'<span class="tag green">是</span>':'<span class="tag gray">否</span>';}
function permTags(u){
  var p=u.perms||{c:true,w:true,l:true};
  return '<span class="tag '+(p.c?'blue':'gray')+'">对话生图</span><span class="tag '+(p.w?'purple':'gray')+'">在线工作流</span><span class="tag '+(p.l?'orange':'gray')+'">Lora训练</span>';
}
function permChkHtml(idC,idW,idL,u){
  var p=u&&u.perms||{c:true,w:true,l:true};
  return '<div class="lic" style="margin-top:6px;"><span class="chk"><input type="checkbox" id="'+idC+'"'+(p.c?' checked':'')+'>对话生图</span><span class="chk"><input type="checkbox" id="'+idW+'"'+(p.w?' checked':'')+'>在线工作流</span><span class="chk"><input type="checkbox" id="'+idL+'"'+(p.l?' checked':'')+'>Lora训练</span></div>';
}
function pager(cur,total,size,fn){
  var pages=Math.max(1,Math.ceil(total/size));
  var h='<span class="page-info">共 '+total+' 条</span>';
  h+='<button '+(cur<=1?'disabled':'')+' data-pg="'+(cur-1)+'">‹</button>';
  var s=Math.max(1,cur-2),e=Math.min(pages,cur+2);
  if(s>1)h+='<button data-pg="1">1</button>'+(s>2?'<span style="color:#9CA3AF;padding:0 2px;">…</span>':'');
  for(var i=s;i<=e;i++)h+='<button class="'+(i===cur?'on':'')+'" data-pg="'+i+'">'+i+'</button>';
  if(e<pages)h+=(e<pages-1?'<span style="color:#9CA3AF;padding:0 2px;">…</span>':'')+'<button data-pg="'+pages+'">'+pages+'</button>';
  h+='<button '+(cur>=pages?'disabled':'')+' data-pg="'+(cur+1)+'">›</button>';
  return '<div class="pager">'+h+'</div>';
}
function bindPager(container,fn){
  container.querySelectorAll('.pager button').forEach(function(b){
    b.onclick=function(){if(!b.disabled)fn(parseInt(b.getAttribute('data-pg'))||1);};
  });
}
function dialog(title,bodyHtml,ftHtml,onOk){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="dialog"><div class="dialog-hd">'+esc(title)+'<span class="x">×</span></div><div class="dialog-bd">'+bodyHtml+'</div>'+(ftHtml?'<div class="dialog-ft">'+ftHtml+'</div>':'')+'</div>';
  m.querySelector('.x').onclick=function(){m.remove();};
  m.addEventListener('click',function(e){if(e.target===m)m.remove();});
  if(onOk){m.querySelector('.ok').onclick=function(){onOk(m);};}
  document.body.appendChild(m);
  setTimeout(function(){m.classList.add('open');},10);
  return m;
}

/* ===== AI图片 / 设计图片管理 ===== */
var IMG_F={kw:'',cat:'',ok:''};
function renderImgs(c,data,label){
  var list=data.filter(function(m){
    if(IMG_F.kw&&m.t.indexOf(IMG_F.kw)<0)return false;
    if(IMG_F.cat&&m.c!==IMG_F.cat)return false;
    if(IMG_F.ok!==''&&String(m.ok)!==IMG_F.ok)return false;
    return true;
  });
  var rows=list.map(function(m){
    return '<tr><td><div class="ph" style="background:'+ph(m.t)+';width:60px;height:44px;"></div></td>'+
    '<td><b>'+esc(m.t)+'</b></td><td><span class="tag blue">'+esc(m.c)+'</span></td>'+
    '<td style="color:var(--sub);font-size:12px;white-space:nowrap;">'+m.date+'</td><td>'+m.gen+'</td><td>'+m.fv+'</td><td>'+m.dl+'</td>'+
    '<td><button class="switch'+(m.ok?' on':'')+'" data-i="'+data.indexOf(m)+'" title="点击切换启用/停用"></button></td>'+
    '<td style="white-space:nowrap;"><button class="btn link" data-i="'+data.indexOf(m)+'">编辑</button><button class="btn link danger" data-i="'+data.indexOf(m)+'">删除</button></td></tr>';
  }).join('');
  c.innerHTML='<div class="panel"><div class="panel-hd"><b>'+label+'</b></div>'+
  '<div class="panel-bd"><div class="toolbar">'+
    '<div class="search"><span style="color:var(--sub);">图片名称</span><input class="input" id="iKw" placeholder="请输入图片名称" value="'+esc(IMG_F.kw||'')+'"></div>'+
    '<select class="sel" id="iCat"><option value="">全部分类</option>'+CATS.map(function(x){return '<option '+(IMG_F.cat===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select>'+
    '<select class="sel" id="iOk"><option value="">状态</option><option value="true"'+(IMG_F.ok==='true'?' selected':'')+'>启用</option><option value="false"'+(IMG_F.ok==='false'?' selected':'')+'>停用</option></select>'+
    '<button class="btn primary sm" id="iSearch">查询</button><button class="btn sm" id="iReset">重置</button>'+
  '</div></div>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>缩略图</th><th>标题</th><th>分类</th><th>上传时间</th><th>在线生图数</th><th>收藏数</th><th>下载次数</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  (list.length?'':'<div style="padding:30px;text-align:center;color:var(--sub);">无数据</div>')+'</div>';
  var w=function(){IMG_F.kw=document.getElementById('iKw').value;IMG_F.cat=document.getElementById('iCat').value;IMG_F.ok=document.getElementById('iOk').value;renderImgs(c,data,label);};
  document.getElementById('iSearch').onclick=w;
  document.getElementById('iReset').onclick=function(){IMG_F={kw:'',cat:'',ok:''};renderImgs(c,data,label);};
  c.querySelectorAll('.switch').forEach(function(s){
    s.onclick=function(){
      var i=parseInt(s.getAttribute('data-i'));
      data[i].ok=!data[i].ok;
      toast('已'+(data[i].ok?'启用':'停用')+'图片「'+data[i].t+'」');
      renderImgs(c,data,label);
    };
  });
  c.querySelectorAll('button.link.danger').forEach(function(b){
    b.onclick=function(){
      var i=parseInt(b.getAttribute('data-i'));
      dialog('删除图片','确定删除图片「'+esc(data[i].t)+'」吗？删除后不可恢复。','<button class="btn sm">取消</button><button class="btn primary sm ok" style="background:var(--red);">删除</button>',function(d){
        data.splice(i,1);d.remove();toast('图片已删除');renderImgs(c,data,label);
      });
    };
  });
  c.querySelectorAll('button.link:not(.danger)').forEach(function(b){
    b.onclick=function(){
      var i=parseInt(b.getAttribute('data-i'));
      var m=data[i];
      dialog('编辑图片',
        '<div class="dform"><label>图片标题</label><input class="input" id="eiT" value="'+esc(m.t)+'"><label>图片类别</label><select class="sel" id="eiC">'+CATS.map(function(x){return '<option '+(m.c===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select><label>描述信息</label><textarea class="input" id="eiD" style="height:64px;resize:none;">'+esc(m.desc||'')+'</textarea></div>',
        '<button class="btn sm">取消</button><button class="btn primary sm ok">保存</button>',
        function(d){
          data[i].t=document.getElementById('eiT').value;
          data[i].c=document.getElementById('eiC').value;
          data[i].desc=document.getElementById('eiD').value;
          d.remove();toast('图片「'+data[i].t+'」已更新');renderImgs(c,data,label);
        });
    };
  });
}

/* ===== 账号下拉与登录 ===== */
var userBox=document.getElementById('userBox'),userMenu=document.getElementById('userMenu');
userBox.onclick=function(e){
  e.stopPropagation();
  userMenu.classList.toggle('open');
  userBox.classList.toggle('open');
};
document.addEventListener('click',function(){
  userMenu.classList.remove('open');userBox.classList.remove('open');
});
function reLogin(acc){
  dialog('重新登录',
    '<div class="dform"><label>账号</label><input class="input" id="rlAcc" value="'+(acc||'admin')+'"><label>密码</label><input class="input" type="password" id="rlPwd" value="123456"></div>',
    '<button class="btn sm">取消</button><button class="btn primary sm ok">登录</button>',
    function(m){
      var a=document.getElementById('rlAcc').value;
      if(a){document.getElementById('topUserName').textContent=a;document.getElementById('topUserRole').textContent='管理员';}
      document.querySelector('.tb-user .ava').textContent=(a||'admin')[0].toUpperCase();
      toast('登录成功');m.remove();
    });
}
userMenu.querySelectorAll('.um-item').forEach(function(it){
  it.onclick=function(){
    var k=it.getAttribute('data-um');
    userMenu.classList.remove('open');userBox.classList.remove('open');
    if(k==='settings'){
      dialog('账号设置',
        '<div class="dform"><label>用户名</label><input class="input" value="admin"><label>手机号</label><input class="input" value="138888888888"><label>角色</label><input class="input" value="管理员" disabled style="background:#F3F4F6;"><label>新密码</label><input class="input" type="password" placeholder="留空则不修改"></div>',
        '<button class="btn sm">取消</button><button class="btn primary sm ok">保存</button>',function(m){toast('原型演示：账号设置已保存');m.remove();});
    }else if(k==='switch'){
      reLogin('admin');
    }else if(k==='logout'){
      dialog('退出登录','确定要退出当前账号吗？','<button class="btn sm">取消</button><button class="btn primary sm ok" style="background:var(--red);">退出</button>',function(m){
        document.getElementById('topUserName').textContent='未登录';
        document.getElementById('topUserRole').textContent='';
        document.querySelector('.tb-user .ava').textContent='?';
        m.remove();
        reLogin();
      });
    }
  };
});
</script>
